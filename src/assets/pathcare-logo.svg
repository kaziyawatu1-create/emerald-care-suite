<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f8f9fa" stroke="#00a878" stroke-width="2"/>
  
  <!-- Main logo design - stylized path with care symbol -->
  <g>
    <!-- Path line -->
    <path d="M 50 120 Q 70 80 100 75 Q 130 70 150 120" fill="none" stroke="#00a878" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Heart symbol overlaying the path -->
    <g transform="translate(100, 90)">
      <path d="M 0 -8 C -5 -13 -12 -13 -12 -6 C -12 0 -6 6 0 12 C 6 6 12 0 12 -6 C 12 -13 5 -13 0 -8 Z" fill="#00a878"/>
    </g>
    
    <!-- Cross symbol (medical) -->
    <g transform="translate(100, 145)">
      <rect x="-2" y="-6" width="4" height="12" fill="#00a878"/>
      <rect x="-6" y="-2" width="12" height="4" fill="#00a878"/>
    </g>
  </g>
  
  <!-- Text: PATHCARE -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00a878" letter-spacing="1">PATHCARE</text>
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666" letter-spacing="0.5">Diagnostic Partner</text>
</svg>